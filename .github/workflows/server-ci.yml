name: Server CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/server/**'
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server dependencies
        working-directory: packages/server
        run: npm ci
      - name: Run unit tests
        working-directory: packages/server
        run: npm test
