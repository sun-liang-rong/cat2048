name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: game/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r ../tools/requirements.txt
      - run: npm ci
      - name: Fingerprint committed runtime assets
        run: python ../tools/fingerprint_runtime_assets.py > "$RUNNER_TEMP/runtime-assets-before.json"
      - run: npm run verify
      - name: Check generated asset content is committed
        run: |
          python ../tools/fingerprint_runtime_assets.py > "$RUNNER_TEMP/runtime-assets-after.json"
          diff -u "$RUNNER_TEMP/runtime-assets-before.json" "$RUNNER_TEMP/runtime-assets-after.json"
